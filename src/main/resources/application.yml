spring:
  profiles:
    default: dev
  application:
    name: sup-shop-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sup_shop}
    username: ${DB_USERNAME:sup_admin}
    password: ${DB_PASSWORD:supsecret}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:sup-shop-images-denis-2026}
    region: ${AWS_S3_REGION:eu-north-1}