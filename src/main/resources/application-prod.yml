spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.supshop: INFO

springdoc:
  # на проде карту API наружу не отдаю, Swagger нужен только при разработке
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false