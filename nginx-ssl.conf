# вход по https для прода, с origin-сертификатом cloudflare.
# локально сертификатов нет, поэтому этот файл подкладываю только через docker-compose.prod.yml
server {
    listen 443 ssl;
    http2 on;
    server_name supshop-md.site www.supshop-md.site;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    include /etc/nginx/snippets/site.conf;
}